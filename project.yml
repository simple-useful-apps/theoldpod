name: TheOldPod
options:
  bundleIdPrefix: com.mattreed
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  OldPodKit:
    path: Packages/OldPodKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  TheOldPod-iOS:
    type: application
    platform: iOS
    productName: TheOldPod
    scheme:
      testTargets:
        - TheOldPod-UITests
    sources:
      - Apps/iOS/Sources
      - Apps/iOS/Resources
    dependencies:
      - package: OldPodKit
        product: OldPodKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattreed.theoldpod
        PRODUCT_NAME: TheOldPod
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: Q565627PU8
    entitlements:
      path: Apps/iOS/TheOldPod-iOS.entitlements
      properties:
        com.apple.developer.icloud-services: [CloudDocuments]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.mattreed.theoldpod]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.com.mattreed.theoldpod]
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleDisplayName: theoldpod
        # Bumped when NSUbiquitousContainers changed effect (the OS caches
        # that dictionary per bundle version) — see docs/ICLOUD.md step 4.
        CFBundleVersion: "2"
        CFBundleShortVersionString: "1.0"
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # Local Documents/Music is visible in the Files app today, ahead of
        # M5's iCloud entitlements (see docs/ICLOUD.md).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSUbiquitousContainers:
          iCloud.com.mattreed.theoldpod:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: "The Old Pod"
            NSUbiquitousContainerSupportedFolderLevels: Any

  TheOldPod-MacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Apps/macOS/UITests
    dependencies:
      - target: TheOldPod-macOS
    settings:
      base:
        TEST_TARGET_NAME: TheOldPod-macOS
        PRODUCT_BUNDLE_IDENTIFIER: com.mattreed.theoldpod.mac.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"

  TheOldPod-UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Apps/iOS/UITests
    dependencies:
      - target: TheOldPod-iOS
    settings:
      base:
        TEST_TARGET_NAME: TheOldPod-iOS
        PRODUCT_BUNDLE_IDENTIFIER: com.mattreed.theoldpod.uitests

  TheOldPod-macOS:
    type: application
    platform: macOS
    productName: TheOldPod
    scheme:
      testTargets:
        - TheOldPod-MacUITests
    sources:
      - Apps/macOS/Sources
      - Apps/macOS/Resources
    dependencies:
      - package: OldPodKit
        product: OldPodKit
    entitlements:
      path: Apps/macOS/TheOldPod-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.developer.icloud-services: [CloudDocuments]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.mattreed.theoldpod]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.com.mattreed.theoldpod]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattreed.theoldpod.mac
        PRODUCT_NAME: TheOldPod
        DEVELOPMENT_TEAM: Q565627PU8
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Apps/macOS/Info.plist
      properties:
        CFBundleDisplayName: theoldpod
        CFBundleVersion: "2"
        CFBundleShortVersionString: "1.0"
        LSApplicationCategoryType: public.app-category.music
        NSUbiquitousContainers:
          iCloud.com.mattreed.theoldpod:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: "The Old Pod"
            NSUbiquitousContainerSupportedFolderLevels: Any
